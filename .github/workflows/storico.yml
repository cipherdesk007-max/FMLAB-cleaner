name: storico

# Ricompila e pubblica le versioni storiche dell'app (nate nel repository FMlab---RunnerKit), una volta sola.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  versione:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - versione: "1.1.0"
            sha: d848157088239b0c19bc6d124b3e5c796d1eb88b
            note: "Prima versione (allora FMlab Pulizia): video grandi, doppioni, registrazioni dello schermo, screenshot, raffiche; scheda Telefono; controllo aggiornamenti. Versione storica: la più recente è in \"ultima\"."
          - versione: "1.3.0"
            sha: 2d52c03aaaabc2d5662e3ef43eb33429e74a2dd2
            note: "Comprende la 1.2.0 (comprimi video, scheda App in LiveContainer) e aggiunge lo svuotamento di Eliminati di recente in una volta. Versione storica: la più recente è in \"ultima\"."
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cipherdesk007-max/FMlab---RunnerKit
          ref: ${{ matrix.sha }}
          path: vecchio
      - name: Theos, toolchain Swift per iOS e SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot rsync curl perl git libxml2 libz3-dev libtinfo6 zip unzip >/dev/null
          git clone --quiet --recursive --depth 1 https://github.com/theos/theos "$HOME/theos"
          curl -sL https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu20.04.tar.xz | tar -xJf - -C "$HOME/theos/toolchain/"
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS16.5.sdk
          mv /tmp/sdks/iPhoneOS16.5.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
      - name: Compila
        run: |
          V=${{ matrix.versione }}
          cd vecchio/fotopulizia/theos
          mkdir -p Sources && cp ../Sorgenti/*.swift Sources/
          sed -i "s/@VERSIONE@/$V/; s/@BUILD@/${GITHUB_RUN_NUMBER}/" Resources/Info.plist
          sed -i "s/^Version: .*/Version: $V/" control
          make package FINALPACKAGE=1 2>&1 | tail -15
          cp packages/*.ipa "$GITHUB_WORKSPACE/FMLAB-Cleaner-$V.ipa"
      - name: Pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ matrix.versione }}
          gh release view "v$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create "v$V" "FMLAB-Cleaner-$V.ipa" -R "$GITHUB_REPOSITORY" --latest=false \
            --title "FMlab Pulizia $V (storica)" --notes "${{ matrix.note }}"
